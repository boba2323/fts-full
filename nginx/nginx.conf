
error_log /var/log/nginx/error.log;


upstream fts_django {
    server django-web:8000; #service name is django-web in compose file
}

server {
    listen 80;
    server_name  crumpet.cc www.crumpet.cc;
    root   /usr/share/nginx/html;
    access_log /var/log/nginx/access.log;
# https://pentacent.medium.com/nginx-and-lets-encrypt-with-docker-in-less-than-5-minutes-b4b8a60d3a71
# https://www.digitalocean.com/community/tutorials/how-to-scale-and-secure-a-django-application-with-docker-nginx-and-let-s-encrypt

    location / {   #serve frontend here
        try_files $uri /index.html;
    }
    location /admin/ {
        proxy_pass http://fts_django/admin/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;  #this is very important as it adds the path apiv1 to all the serialiser hyperlinks
        proxy_redirect off;
    }

    location /apiv1/ {  #backend here
        proxy_pass http://fts_django/apiv1/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;   
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }
}
