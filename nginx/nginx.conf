
error_log /var/log/nginx/error.log;

server {
    listen       80;
    root   /usr/share/nginx/html;
    access_log /var/log/nginx/access.log;

    location / {   #serve frontend here
        try_files $uri /index.html;
    }
    location /admin/ {
        proxy_pass http://127.0.0.1:8000/admin/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;  #this is very important as it adds the path apiv1 to all the serialiser hyperlinks
        proxy_redirect off;
    }

    location /apiv1/ { 
        proxy_pass http://127.0.0.1:8000/apiv1/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $http_host;   
        proxy_redirect off;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

}